name: Build Bus Alarm APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's runner already ships the Android SDK; just accept its licenses.
      - name: Accept Android SDK licenses
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: node scripts/prepare-android.mjs

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../build.log || {
            grep -E "error:|FAILED|What went wrong|Execution failed|cannot find symbol|symbol:|location:" -A2 ../build.log | head -60 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
            exit 1
          }

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: bus-alarm-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
